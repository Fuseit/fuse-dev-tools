# STYLE COPS
# This file contains changes to the default config provided by Rubocop

Style/AccessorGrouping:
  Enabled: true
Style/Alias:
  EnforcedStyle: prefer_alias_method
Style/ArrayCoercion:
  Enabled: true
Style/BisectedAttrAccessor:
  Enabled: true
Style/CaseLikeIf:
  Enabled: true
# TODO: Add to FuseTube
# Style/ClassAndModuleChildren:
#   Exclude:
#     - app/api/**/*.rb
# Less searchable keywords are better in my opinion, but happy with either of these.
Style/CommentAnnotation:
  Keywords:
    - TODO
    - FIXME
    - NOTE
Style/Documentation:
  Enabled: false
Style/DoubleNegation:
  Enabled: false
Style/EmptyCaseCondition:
  Enabled: false
Style/ExplicitBlockArgument:
  Enabled: true
Style/ExponentialNotation:
  Enabled: true
# Consider re-enabling when upgrading to Ruby 3.0 or if we want to support it.
Style/FrozenStringLiteralComment:
  Enabled: false
Style/GlobalStdStream:
  Enabled: true
Style/HashAsLastArrayItem:
  Enabled: true
Style/HashEachMethods:
  Enabled: true
Style/HashLikeCase:
  Enabled: true
Style/HashSyntax:
  EnforcedStyle: ruby19_no_mixed_keys
Style/HashTransformKeys:
  Enabled: true
Style/HashTransformValues:
  Enabled: true
Style/InlineComment:
  Enabled: true
Style/MethodCalledOnDoEndBlock:
  Enabled: true
# NOTE: Default is to require parentheses, however due to legacy decisions we set to require none...
Style/MethodDefParentheses:
  EnforcedStyle: require_no_parentheses
Style/NonNilCheck:
  IncludeSemanticChanges: true
Style/OptionalBooleanParameter:
  Enabled: true
# Only allowed keyword is `options`
Style/OptionHash:
  Enabled: true
  SuspiciousParamNames:
    - opts
    - args
    - params
    - parameters
Style/RedundantAssignment:
  Enabled: true
Style/RedundantFetchBlock:
  Enabled: true
Style/RedundantFileExtensionInRequire:
  Enabled: true
Style/RedundantRegexpCharacterClass:
  Enabled: true
Style/RedundantRegexpEscape:
  Enabled: true
Style/SingleArgumentDig:
  Enabled: true
Style/SlicingWithRange:
  Enabled: true
Style/StringConcatenation:
  Enabled: true
Style/SymbolArray:
  MinSize: 1
Style/WordArray:
  MinSize: 1
