# RAILS COPS
# This file contains changes to the default config provided by Rubocop

# Please remember to set TargetRailsVersion in repository!

Rails/ActiveRecordCallbacksOrder:
  Enabled: true
Rails/FindById:
  Enabled: true
# Rails/HttpPositionalArguments:
#   Enabled: true
Rails/Inquiry:
  Enabled: true
Rails/MailerName:
  Enabled: true
Rails/MatchRoute:
  Enabled: true
Rails/NegateInclude:
  Enabled: true
Rails/Output:
  # TODO: Define in FuseTube
  Exclude:
    - lib/**/*.rb
Rails/Pluck:
  Enabled: true
Rails/PluckInWhere:
  Enabled: true
# Open to suggestion, however I do not prefer the implicitness of this cop
Rails/RedundantReceiverInWithOptions:
  Enabled: false
Rails/RenderInline:
  Enabled: true
Rails/RenderPlainText:
  Enabled: true
Rails/SafeNavigation:
  ConvertTry: true
Rails/SaveBang:
  Enabled: true
Rails/ShortI18n:
  Enabled: true
Rails/SkipsModelValidations:
  Enabled: false
Rails/WhereExists:
  Enabled: true
